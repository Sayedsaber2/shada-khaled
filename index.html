<!doctype html>
<html lang="en" data-theme="dark" class="intro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shada Khaled — UI/UX Designer</title>
    <meta
      name="description"
      content="Portfolio of Shada Khaled — a UI/UX designer in training (DEPI) based in Giza, Egypt. Calm, clear interfaces designed with a maker's precision."
    />
    <meta name="author" content="Shada Khaled Ebrahim" />
    <meta name="theme-color" content="#0b0912" />

    <!-- Social sharing preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shada Khaled — UI/UX Designer" />
    <meta
      property="og:description"
      content="Calm, clear interfaces — designed with the precision of three years in laser-cut production and vector work."
    />
    <meta property="og:image" content="%BASE_URL%images/profile.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- %BASE_URL% = Vite's `base` config (vite.config.ts). Locally that's "/"; on the
         deployed GitHub Pages site it's "/shada-khaled/" — Vite fills it in either way. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preload" as="image" href="%BASE_URL%images/profile.jpg" fetchpriority="high" />

    <!-- Critical CSS: paint the ink background immediately, so there is never a white flash -->
    <style>
      html {
        background: #0b0912;
      }
      html[data-theme='light'] {
        background: #faf7f2;
      }
      /* While the (always dark) preloader is up, keep the page ink-dark in BOTH themes.
         AppContext removes the class when the curtain lifts. */
      html.intro,
      html.intro body {
        background: #0b0912;
      }
    </style>

    <!-- Apply the saved theme before the first paint -->
    <script>
      try {
        var saved = localStorage.getItem('shada-portfolio-theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; color: #f2eef9">
        This portfolio needs JavaScript to run. You can still reach me at shadakhaled07@gmail.com.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
